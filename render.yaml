services:
  - type: web
    name: project-sim
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ranking
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/game.db
      - key: INITIAL_GM_USER
        sync: false
      - key: INITIAL_GM_PASS
        sync: false
    disk:
      name: game-data
      mountPath: /var/data
      sizeGB: 1
