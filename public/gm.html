<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project-Sim GM 패널</title>
  <link rel="stylesheet" href="/css/game.css" />
  <link rel="stylesheet" href="/css/gm.css" />
</head>
<body class="gm">
  <header class="gm-top">
    <b class="logo-s">PROJECT·SIM <span>GM</span></b>
    <nav>
      <button data-tab="overview" class="on">서버 현황</button>
      <button data-tab="players">플레이어</button>
      <button data-tab="notice">공지</button>
      <button data-tab="audit">GM 기록</button>
      <button data-tab="security">보안 로그</button>
    </nav>
    <span id="gm-who"></span>
    <a href="/" class="btn small">게임으로</a>
  </header>
  <main id="gm-main"></main>
  <div id="gm-login" class="hidden">
    <div class="login-card">
      <h1 class="logo">GM 로그인</h1>
      <form id="gm-form">
        <input id="gm-user" placeholder="GM 아이디" autocomplete="username" required />
        <input id="gm-pass" type="password" placeholder="비밀번호" autocomplete="current-password" required />
        <button class="btn primary" type="submit">로그인</button>
        <p id="gm-msg" class="msg"></p>
      </form>
    </div>
  </div>
  <div id="tooltip" class="hidden"></div>
  <script type="module" src="/js/gm.js"></script>
</body>
</html>
