<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abyss Run 관리자</title>
  <link rel="stylesheet" href="/css/game.css" />
  <link rel="stylesheet" href="/css/gm.css" />
</head>
<body class="gm">
  <header class="gm-top">
    <b class="logo-s">ABYSS·RUN <span>관리자</span></b>
    <nav>
      <button data-tab="overview" class="on">서버 현황</button>
      <button data-tab="players">플레이어</button>
      <button data-tab="notice">공지</button>
      <button data-tab="audit">관리 기록</button>
      <button data-tab="security">보안 로그</button>
    </nav>
    <span id="gm-who"></span>
    <button id="gm-pw" class="btn small">비밀번호 변경</button>
    <button id="gm-out" class="btn small">관리자 나가기</button>
    <a href="/" class="btn small">게임으로</a>
  </header>
  <main id="gm-main"></main>
  <div id="gm-login" class="hidden">
    <div class="login-card">
      <h1 class="logo">관리자</h1>
      <p class="note" id="gm-note">관리자 비밀번호를 넣어 주세요.</p>
      <form id="gm-form">
        <input id="gm-key" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" required />
        <input id="gm-key2" type="password" placeholder="비밀번호 한 번 더" autocomplete="new-password" class="hidden" />
        <button class="btn primary" id="gm-go" type="submit">들어가기</button>
        <p id="gm-msg" class="msg"></p>
      </form>
    </div>
  </div>
  <div id="tooltip" class="hidden"></div>
  <script type="module" src="/js/gm.js"></script>
</body>
</html>
