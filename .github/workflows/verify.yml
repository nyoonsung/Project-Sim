name: Verify game build
on:
  workflow_dispatch:
  push:
    branches: [feature/dungeon-two, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cf
      # 정적 자산 생성뿐 아니라 Worker 엔트리포인트도 Wrangler로 실제 번들링 검사
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
